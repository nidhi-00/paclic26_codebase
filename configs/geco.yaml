corpus_name: geco_monolingual_english
language: en

raw_row_filters:
  - column: GROUP
    equals: monolingual
  - column: LANGUAGE_RANK
    equals: L1
  - column: LANGUAGE
    equals: English

derived_sentence_id:
  columns: [PART, TRIAL]
  separator: "-"

column_map:
  participant_id: PP_NR
  sentence_id: sentence_id
  word_id: WORD_ID_WITHIN_TRIAL
  word: WORD
  first_fixation_duration: WORD_FIRST_FIXATION_DURATION
  gaze_duration: WORD_GAZE_DURATION
  go_past_time: WORD_GO_PAST_TIME
  total_reading_time: WORD_TOTAL_READING_TIME

optional_column_map:
  sentence_text: ""
  position_in_sentence: WORD_ID_WITHIN_TRIAL
  sentence_length: ""
  pos: ""
  is_content_word: ""

filters:
  min_rt: 50
  max_first_fixation_duration: 800
  max_gaze_duration: 1500
  max_go_past_time: 5000
  max_total_reading_time: 8000

# Edit this after running:
# python -m src.inspect_tabular --input data/raw/geco/MonolingualReadingData.xlsx --rows 5

corpus_name: geco

# Map your raw GECO column names to the common schema.
# Keep values blank until you inspect the file.
column_map:
  participant_id: ""
  sentence_id: ""
  word_id: ""
  word: ""
  first_fixation_duration: ""
  gaze_duration: ""
  go_past_time: ""
  total_reading_time: ""

# Optional if the corpus already has sentence text or sentence position.
optional_column_map:
  sentence_text: ""
  position_in_sentence: ""
  sentence_length: ""

# Reading-time filters in milliseconds. Adjust after inspecting histograms.
filters:
  min_rt: 50
  max_first_fixation_duration: 800
  max_gaze_duration: 1500
  max_go_past_time: 5000
  max_total_reading_time: 8000

# If sentence_text is missing, prepare_corpus will reconstruct sentences by
# grouping sentence_id and sorting by position/word_id.
reconstruct_sentences: true
